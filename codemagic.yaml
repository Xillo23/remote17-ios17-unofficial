# Remote17 (unofficial) - unsigned iOS 17 IPA on Codemagic.
# Alternative to .github/workflows/remote17-ios17-ipa.yml for people who cannot use GitHub
# Actions. Uses no secrets, no Apple account and no code signing.
workflows:
  remote17-ios17-ipa:
    name: Remote17 unsigned iOS 17 IPA
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      node: 26.12.1
      xcode: latest
      cocoapods: default
      vars:
        APP_VARIANT: production
        REMOTE17_FORK_BUILD: "1"
        EXPO_NO_GIT_STATUS: "1"
        EXPO_NO_TELEMETRY: "1"
        CI: "1"
        NODE_OPTIONS: --max-old-space-size=6144
        CONFIGURATION: Release
    scripts:
      - name: Install pnpm and mobile dependencies
        script: |
          node --version
          npm install -g "pnpm@$(node -p "require('./package.json').packageManager.split('@').pop()")"
          pnpm --version
          pnpm install --frozen-lockfile --filter=@t3tools/mobile... --filter=@t3tools/scripts...

      - name: Make sure no T3 cloud configuration is present
        script: |
          rm -f .env .env.local
          for k in T3CODE_CLERK_PUBLISHABLE_KEY T3CODE_RELAY_URL EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY; do
            if [ -n "${!k:-}" ]; then echo "$k must not be set"; exit 1; fi
          done
          cd apps/mobile
          pnpm exec expo config --type public --json > /tmp/expo-config.json
          node -e "
            const c = require('/tmp/expo-config.json');
            console.log(JSON.stringify({ name: c.name, bundle: c.ios?.bundleIdentifier, team: c.ios?.appleTeamId ?? null,
              domains: c.ios?.associatedDomains, updates: c.updates?.enabled }, null, 2));
            const str = (v) => typeof v === 'string' && v.trim() !== '';
            console.log('clerk:', JSON.stringify(c.extra?.clerk), 'relay:', JSON.stringify(c.extra?.relay));
            if (str(c.extra?.clerk?.publishableKey) || str(c.extra?.relay?.url)) { console.error('Cloud config leaked into build'); process.exit(1); }"

      - name: Expo prebuild (iOS)
        script: |
          cd apps/mobile
          pnpm exec expo prebuild --platform ios --clean
          cd ios
          grep -ho 'IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*' *.xcodeproj/project.pbxproj Pods/Pods.xcodeproj/project.pbxproj | sort | uniq -c
          grep -ho 'IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*' *.xcodeproj/project.pbxproj Pods/Pods.xcodeproj/project.pbxproj \
            | awk '{split($3,v,"."); if (v[1] > 17) bad=1} END {exit bad}'

      - name: xcodebuild (no code signing)
        script: |
          set -o pipefail
          cd apps/mobile/ios
          workspace="$(ls -d *.xcworkspace | head -1)"
          xcodebuild -workspace "$workspace" -scheme "${workspace%.xcworkspace}" \
            -configuration "$CONFIGURATION" -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO build 2>&1 | tee "$CM_BUILD_DIR/xcodebuild.log" \
            | grep -E "error:|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" "$CM_BUILD_DIR/xcodebuild.log"

      - name: Package IPA files
        script: |
          set -euo pipefail
          app="$(ls -d "$CM_BUILD_DIR/dd/Build/Products/$CONFIGURATION-iphoneos"/*.app | head -1)"
          name="$(basename "$app" .app)"
          echo "MinimumOSVersion: $(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$app/Info.plist")"
          bad=0
          while IFS= read -r -d '' f; do
            if file "$f" | grep -q "Mach-O"; then
              minos="$(vtool -show-build "$f" 2>/dev/null | awk '/minos/ {print $2; exit}')"
              if [ -n "$minos" ] && [ "${minos%%.*}" -gt 17 ]; then echo "$f needs iOS $minos"; bad=1; fi
            fi
          done < <(find "$app" -type f -print0)
          [ "$bad" = 0 ]

          dist="$CM_BUILD_DIR/dist"
          mkdir -p "$dist/unsigned/Payload" "$dist/adhoc/Payload"
          cp -R "$app" "$dist/unsigned/Payload/"
          cp -R "$app" "$dist/adhoc/Payload/"
          (cd "$dist/unsigned" && zip -qry "../${name}-iOS17-unsigned.ipa" Payload)

          adhoc_app="$dist/adhoc/Payload/$(basename "$app")"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$adhoc_app/Info.plist")"
          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict>' \
            "<key>application-identifier</key><string>REMOTE17AA.${bundle_id}</string>" \
            "<key>keychain-access-groups</key><array><string>REMOTE17AA.${bundle_id}</string></array>" \
            '<key>get-task-allow</key><false/>' \
            '</dict></plist>' > /tmp/ent.plist
          find "$adhoc_app" -depth \( -name "*.framework" -o -name "*.dylib" -o -name "*.appex" \) -print0 \
            | xargs -0 -I{} codesign --force --sign - --timestamp=none "{}"
          codesign --force --sign - --timestamp=none --entitlements /tmp/ent.plist "$adhoc_app"
          (cd "$dist/adhoc" && zip -qry "../${name}-iOS17-adhoc-signed.ipa" Payload)
          (cd "$dist" && shasum -a 256 *.ipa | tee SHA256SUMS.txt)

    artifacts:
      - dist/*.ipa
      - dist/SHA256SUMS.txt
      - xcodebuild.log
